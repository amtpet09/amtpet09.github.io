<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMT Pet Marketplace – Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      min-height: 100vh;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      text-align: center;
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
      background: linear-gradient(90deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .avatar-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 1.5rem;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #6366f1;
      background: #1e293b;
      display: block;
    }

    .avatar-placeholder {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #1e293b;
      border: 3px dashed #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #64748b;
    }

    .avatar-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #6366f1;
      color: white;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .avatar-btn:hover { background: #4f46e5; }

    input[type="file"] { display: none; }

    .info {
      background: rgba(30, 41, 59, 0.6);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      text-align: left;
    }

    .info strong { color: #a5b4fc; }

    .btn {
      width: 100%;
      padding: 0.95rem 1.25rem;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 0.75rem;
    }

    .btn-primary {
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      color: white;
    }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
    }
    .btn-secondary:hover { background: rgba(71, 85, 105, 0.3); }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .loading-overlay.active { display: flex; }

    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid #334155;
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 1.25rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 1.15rem;
      color: #e2e8f0;
      font-weight: 500;
    }

    .hidden { display: none !important; }

    .marketplace {
      display: none;
      width: 100%;
      max-width: 900px;
      padding: 1.5rem;
    }

    .marketplace.active { display: block; }

    .topbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      background: rgba(15, 23, 42, 0.7);
      padding: 0.85rem 1.25rem;
      border-radius: 16px;
    }

    .topbar img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #6366f1;
    }

    .topbar .name { font-weight: 600; font-size: 1.1rem; }
    .topbar .meta { font-size: 0.85rem; color: #94a3b8; }

    .pets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
    }

    .pet-card {
      background: rgba(30, 41, 59, 0.7);
      border-radius: 14px;
      padding: 1rem;
      text-align: center;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .pet-card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 0.5rem;
    }

    .pet-card h3 { font-size: 0.95rem; margin-bottom: 0.25rem; }
    .pet-card .price { color: #a78bfa; font-weight: 600; font-size: 0.9rem; }

    .error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="card" id="loginScreen">
    <div class="logo">AMT Pets</div>
    <div class="subtitle">Pet Marketplace on Pi Testnet</div>

    <div class="avatar-wrap">
      <div class="avatar-placeholder" id="avatarPlaceholder">👤</div>
      <img class="avatar hidden" id="avatarPreview" alt="Profile" />
      <button class="avatar-btn" id="avatarBtn" title="Choose profile picture">📷</button>
      <input type="file" id="avatarInput" accept="image/*" />
    </div>

    <div class="info">
      <div><strong>Price:</strong> 20 AMT per pet</div>
      <div style="margin-top:4px"><strong>Network:</strong> Pi Testnet</div>
    </div>

    <div class="error" id="errorBox"></div>

    <button class="btn btn-primary" id="loginBtn">
      Login with Pi
    </button>

    <p style="font-size:0.8rem;color:#64748b;margin-top:0.5rem">
      After login, you can sync your wallet & enter the marketplace
    </p>
  </div>

  <!-- LOADING -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Logging in...</div>
  </div>

  <!-- MARKETPLACE (simple demo) -->
  <div class="marketplace" id="marketplace">
    <div class="topbar">
      <img id="userAvatar" src="" alt="" />
      <div>
        <div class="name" id="userName">Pioneer</div>
        <div class="meta" id="userMeta">Loading...</div>
      </div>
    </div>

    <h2 style="margin-bottom:1rem;font-size:1.3rem">Pet Marketplace</h2>
    <div class="pets-grid" id="petsGrid">
      <!-- pets will be loaded here -->
    </div>
  </div>

  <script>
    // ========== CONFIG ==========
    // Palitan mo ito ng actual backend URL mo (Render / local)
    const API_BASE = "https://your-backend.onrender.com";   // <-- PALITAN

    // ========== STATE ==========
    let accessToken = null;
    let pioneer = null;
    let profilePictureData = null; // base64 or url

    // ========== ELEMENTS ==========
    const loginScreen = document.getElementById("loginScreen");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const loadingText = document.getElementById("loadingText");
    const marketplace = document.getElementById("marketplace");
    const errorBox = document.getElementById("errorBox");
    const avatarInput = document.getElementById("avatarInput");
    const avatarPreview = document.getElementById("avatarPreview");
    const avatarPlaceholder = document.getElementById("avatarPlaceholder");
    const loginBtn = document.getElementById("loginBtn");

    // ========== HELPERS ==========
    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add("show");
    }
    function hideError() {
      errorBox.classList.remove("show");
    }

    function showLoading(text = "Loading...") {
      loadingText.textContent = text;
      loadingOverlay.classList.add("active");
    }
    function hideLoading() {
      loadingOverlay.classList.remove("active");
    }

    // ========== PROFILE PICTURE ==========
    document.getElementById("avatarBtn").addEventListener("click", () => {
      avatarInput.click();
    });

    avatarInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      if (file.size > 2 * 1024 * 1024) {
        showError("Image too large (max 2MB)");
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        profilePictureData = reader.result; // data:image/...;base64,...
        avatarPreview.src = profilePictureData;
        avatarPreview.classList.remove("hidden");
        avatarPlaceholder.classList.add("hidden");
      };
      reader.readAsDataURL(file);
    });

    // ========== LOGIN FLOW ==========
    loginBtn.addEventListener("click", async () => {
      hideError();
      showLoading("Connecting to Pi Network...");

      try {
        // -------------------------------------------------
        // DITO MO I-CONNECT ANG ACTUAL PI SDK
        // Halimbawa:
        // const authResult = await window.Pi.authenticate([...scopes], onIncompletePaymentFound);
        // accessToken = authResult.accessToken;
        // -------------------------------------------------

        // TEMPORARY DEMO (tanggalin mo ito kapag may real Pi SDK na)
        // Simulan mo muna ng dummy token para testing
        await new Promise(r => setTimeout(r, 1200)); // simulate delay

        // Kapag may real Pi SDK na, gamitin mo ang accessToken mula sa Pi
        // accessToken = authResult.accessToken;

        // Para sa demo, huwag muna i-call ang backend kung wala pang real token.
        // Kapag ready na ang Pi SDK, i-uncomment ang code sa baba.

        /*
        showLoading("Verifying Pioneer...");

        const res = await fetch(API_BASE + "/api/auth/verify", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + accessToken
          },
          body: JSON.stringify({ accessToken })
        });

        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Authentication failed");

        pioneer = data.pioneer;

        // Save profile picture if selected
        if (profilePictureData) {
          showLoading("Saving profile picture...");
          await fetch(API_BASE + "/api/profile/picture", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + accessToken
            },
            body: JSON.stringify({ profile_picture: profilePictureData })
          });
        }

        // Enter marketplace
        showLoading("Entering AMT Pet Marketplace...");
        await new Promise(r => setTimeout(r, 800));

        enterMarketplace(data);
        */

        // DEMO ONLY – tanggalin kapag may real Pi login na
        showLoading("Entering AMT Pet Marketplace...");
        await new Promise(r => setTimeout(r, 1000));
        enterMarketplace({
          username: "DemoPioneer",
          profilePicture: profilePictureData,
          walletSynced: false,
          needsWalletSync: true
        });

      } catch (err) {
        hideLoading();
        showError(err.message || "Login failed");
      }
    });

    function enterMarketplace(data) {
      hideLoading();
      loginScreen.classList.add("hidden");
      marketplace.classList.add("active");

      // Top bar
      const name = data.username || data.pioneer?.username || "Pioneer";
      document.getElementById("userName").textContent = name;

      const pic = data.profilePicture || data.profile_picture || profilePictureData;
      if (pic) {
        document.getElementById("userAvatar").src = pic;
      } else {
        document.getElementById("userAvatar").src = "https://via.placeholder.com/48/6366f1/ffffff?text=P";
      }

      const meta = data.walletSynced
        ? "Wallet synchronized • Ready to buy"
        : "Wallet not yet synced • Sync to use AMT";
      document.getElementById("userMeta").textContent = meta;

      // Load pets (demo)
      loadPets();
    }

    async function loadPets() {
      const grid = document.getElementById("petsGrid");
      grid.innerHTML = "<p style='grid-column:1/-1;color:#94a3b8'>Loading pets...</p>";

      try {
        // Real call:
        // const res = await fetch(API_BASE + "/api/pets");
        // const data = await res.json();

        // Demo data
        const demoPets = [
          { name: "Terrax", element: "Earth", price: 20 },
          { name: "Aqualis", element: "Water", price: 20 },
          { name: "Flammy", element: "Fire", price: 20 },
          { name: "Zephyrin", element: "Wind", price: 20 },
          { name: "Frostbite", element: "Ice", price: 20 },
          { name: "Voltix", element: "Thunder", price: 20 }
        ];

        grid.innerHTML = demoPets.map(p => `
          <div class="pet-card">
            <div style="font-size:2.5rem;margin-bottom:0.4rem">🐾</div>
            <h3>${p.name}</h3>
            <div style="font-size:0.8rem;color:#94a3b8">${p.element}</div>
            <div class="price">${p.price} AMT</div>
          </div>
        `).join("");
      } catch (e) {
        grid.innerHTML = "<p style='color:#fca5a5'>Failed to load pets</p>";
      }
    }
  </script>
</body>
</html>
