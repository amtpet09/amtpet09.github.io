<script>
const API='https://amtpet09-github-io.onrender.com';

let pets=[];
let selectedPet=null;
let currentUser=null;
let paymentInProgress=false;

const PET_PI_PRICE=10;

const $=id=>document.getElementById(id);

function esc(x){
  return String(x??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function img(x){
  return './'+String(x||'').replace(/[^\w.-]/g,'');
}

function toast(msg){
  $('toast').textContent=msg;
  $('toast').style.display='block';

  clearTimeout(window.__toast);

  window.__toast=setTimeout(()=>{
    $('toast').style.display='none';
  },3200);
}

function showPanel(id,btn){
  document.querySelectorAll('.panel').forEach(x=>{
    x.classList.remove('active');
  });

  $(id).classList.add('active');

  document.querySelectorAll('.tab').forEach(x=>{
    x.classList.remove('active');
  });

  btn.classList.add('active');

  if(id==='pets'){
    loadMyPets();
  }
}

function featureSoon(name){
  toast(name+' is prepared. Backend rules will be connected next.');
}

function logoutPi(){
  localStorage.removeItem('amtPetPiUid');
  localStorage.removeItem('amtPetPiUsername');
  localStorage.removeItem('amtPetPiWallet');
  localStorage.removeItem('amtPetPiAccessToken');
  localStorage.removeItem('amtPetProfileImage');

  currentUser=null;
  selectedPet=null;
  paymentInProgress=false;

  $('app').style.display='none';
  $('loginScreen').style.display='flex';

  $('loginBtn').disabled=false;
  $('loginBtn').textContent='🟣 LOGIN WITH PI';
}

/* =========================================================
   PI INCOMPLETE PAYMENT RECOVERY
   ========================================================= */

function getPendingPaymentId(payment){
  if(!payment)return '';

  return String(
    payment.identifier ||
    payment.payment_id ||
    payment.paymentId ||
    payment.id ||
    ''
  );
}

function getPendingPetCode(payment){
  if(!payment)return '';

  const metadata=payment.metadata||{};

  return String(
    metadata.pet_code ||
    metadata.petCode ||
    payment.pet_code ||
    payment.petCode ||
    ''
  );
}

function getPendingTxid(payment){
  if(!payment)return '';

  return String(
    payment.txid ||
    payment.transaction_id ||
    payment.transactionId ||
    payment.transaction?.txid ||
    payment.transaction?.id ||
    ''
  );
}

async function recoverIncompletePayment(payment){
  console.log('INCOMPLETE PAYMENT FOUND:',payment);

  const paymentId=getPendingPaymentId(payment);
  const petCode=getPendingPetCode(payment);
  const txid=getPendingTxid(payment);

  if(paymentId){
    localStorage.setItem('amtPetPendingPaymentId',paymentId);
  }

  if(petCode){
    localStorage.setItem('amtPetPendingPetCode',petCode);
  }

  if(!paymentId){
    console.warn('Incomplete payment found but no payment ID was returned.');
    toast('A pending Pi payment was found. Please wait and try again later.');
    return;
  }

  if(!currentUser?.accessToken){
    console.warn('Cannot recover payment because Pi access token is missing.');
    toast('Pending Pi payment found. Please login with Pi again.');
    return;
  }

  try{
    toast('Recovering your pending Pi payment...');

    let finalPetCode=petCode;

    /*
     * If the incomplete payment did not expose pet_code,
     * use the locally saved pet code from the previous attempt.
     */
    if(!finalPetCode){
      finalPetCode=
        localStorage.getItem('amtPetPendingPetCode')||'';
    }

    if(!finalPetCode){
      console.warn('Payment ID found but pet code is unavailable:',paymentId);

      toast(
        'Pending payment found. Payment ID detected, but pet information is unavailable.'
      );

      return;
    }

    /*
     * STEP 1 — PREPARE
     */
    const prep=await fetch(API+'/api/payments/pi/prepare',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+currentUser.accessToken
      },
      body:JSON.stringify({
        payment_id:paymentId,
        pet_code:finalPetCode
      })
    });

    const prepData=await prep.json().catch(()=>({}));

    console.log('Pending payment prepare:',prepData);

    /*
     * If backend says payment already exists or is already approved,
     * continue to the next step.
     */
    if(!prep.ok){
      const prepError=String(
        prepData.error||
        prepData.message||
        ''
      ).toLowerCase();

      if(
        !prepError.includes('already') &&
        !prepError.includes('approved') &&
        !prepError.includes('completed')
      ){
        throw Error(
          prepData.error||
          prepData.message||
          'Pending payment preparation failed.'
        );
      }
    }

    /*
     * STEP 2 — APPROVE
     */
    const approval=await fetch(API+'/api/payments/pi/approve',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+currentUser.accessToken
      },
      body:JSON.stringify({
        payment_id:paymentId,
        pet_code:finalPetCode
      })
    });

    const approvalData=await approval.json().catch(()=>({}));

    console.log('Pending payment approval:',approvalData);

    if(!approval.ok){
      const approvalError=String(
        approvalData.error||
        approvalData.message||
        ''
      ).toLowerCase();

      if(
        !approvalError.includes('already') &&
        !approvalError.includes('approved') &&
        !approvalError.includes('completed')
      ){
        throw Error(
          approvalData.error||
          approvalData.message||
          'Pending payment approval failed.'
        );
      }
    }

    /*
     * STEP 3 — COMPLETE
     *
     * Pass txid when Pi supplied it.
     * If Pi did not expose txid, backend will try to retrieve it.
     */
    const completeBody={
      payment_id:paymentId,
      pet_code:finalPetCode
    };

    if(txid){
      completeBody.txid=txid;
    }

    const complete=await fetch(API+'/api/payments/pi/complete',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+currentUser.accessToken
      },
      body:JSON.stringify(completeBody)
    });

    const completeData=await complete.json().catch(()=>({}));

    console.log('Pending payment completion:',completeData);

    if(!complete.ok){
      throw Error(
        completeData.error||
        completeData.message||
        'Pending payment completion is not ready yet.'
      );
    }

    /*
     * SUCCESS
     */
    localStorage.removeItem('amtPetPendingPaymentId');
    localStorage.removeItem('amtPetPendingPetCode');

    toast('✅ Your pending Pi payment has been recovered.');

    await loadMyPets();

  }catch(error){
    console.error('INCOMPLETE PAYMENT RECOVERY:',error);

    toast(
      error.message||
      'Pending Pi payment is still being processed.'
    );
  }
}

/* =========================================================
   PI LOGIN
   ========================================================= */

function loginPi(){
  if(!window.Pi){
    toast('Open AMT Pet Marketplace in Pi Browser.');
    return;
  }

  if(paymentInProgress){
    toast('Please wait. A Pi payment is already processing.');
    return;
  }

  $('loginBtn').disabled=true;
  $('loginBtn').textContent='Connecting to Pi...';

  try{

    Pi.init({
      version:'2.0',
      sandbox:true
    });

    Pi.authenticate(
      ['username','payments'],

      incompletePayment=>{
        console.log(
          'Pi SDK incomplete payment callback:',
          incompletePayment
        );

        window.__incompletePiPayment=incompletePayment||null;

        /*
         * Do not create another payment here.
         * The pending payment will be recovered after
         * successful authentication.
         */
      }

    ).then(async auth=>{

      console.log('Pi authentication successful:',auth);

      const u=auth.user||{};

      currentUser={
        uid:u.uid||'',
        username:u.username||'Pioneer',
        wallet_address:u.wallet_address||'',
        accessToken:auth.accessToken||''
      };

      localStorage.setItem(
        'amtPetPiUid',
        currentUser.uid
      );

      localStorage.setItem(
        'amtPetPiUsername',
        currentUser.username
      );

      localStorage.setItem(
        'amtPetPiWallet',
        currentUser.wallet_address
      );

      localStorage.setItem(
        'amtPetPiAccessToken',
        currentUser.accessToken
      );

      /*
       * Synchronize Pioneer with Render backend.
       */
      await syncPioneer();

      /*
       * Enter marketplace first.
       */
      enterApp();

      toast(
        'Welcome, @'+currentUser.username+'! Wallet synchronized.'
      );

      /*
       * Give Pi SDK a moment to finish authentication,
       * then recover an incomplete payment if one exists.
       */
      setTimeout(async()=>{
        const pending=
          window.__incompletePiPayment||null;

        if(pending){
          await recoverIncompletePayment(pending);
        }
      },800);

    }).catch(e=>{

      console.error('Pi Login:',e);

      $('loginBtn').disabled=false;
      $('loginBtn').textContent='🟣 LOGIN WITH PI';

      toast(
        e?.message||
        'Pi Login failed. Please try again in Pi Browser.'
      );

    });

  }catch(e){

    console.error('Pi initialization:',e);

    $('loginBtn').disabled=false;
    $('loginBtn').textContent='🟣 LOGIN WITH PI';

    toast(
      e?.message||
      'Unable to start Pi Login.'
    );
  }
}

/* =========================================================
   BACKEND PIONEER SYNC
   ========================================================= */

async function syncPioneer(){

  try{

    const r=await fetch(
      API+'/api/auth/verify',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':
            'Bearer '+(currentUser?.accessToken||'')
        }
      }
    );

    if(r.ok){

      const d=await r.json();

      if(d.walletAddress){
        currentUser.wallet_address=d.walletAddress;
      }

      if(d.wallet_address){
        currentUser.wallet_address=d.wallet_address;
      }

      if(d.username){
        currentUser.username=d.username;
      }

      if(d.uid){
        currentUser.uid=d.uid;
      }

    }else{

      console.warn(
        'Backend Pi verification returned:',
        r.status
      );

    }

  }catch(e){

    console.log(
      'Optional backend sync:',
      e
    );

  }

  localStorage.setItem(
    'amtPetPiWallet',
    currentUser?.wallet_address||''
  );

  localStorage.setItem(
    'amtPetPiUid',
    currentUser?.uid||''
  );

  localStorage.setItem(
    'amtPetPiUsername',
    currentUser?.username||''
  );
}

/* =========================================================
   ENTER APP
   ========================================================= */

function enterApp(){

  $('loginScreen').style.display='none';
  $('app').style.display='block';

  $('navUser').textContent=
    '@'+(currentUser?.username||'Pioneer');

  $('profileName').textContent=
    '@'+(currentUser?.username||'Pioneer');

  $('profileUid').textContent=
    'Pi UID: '+(currentUser?.uid||'—');

  $('walletAddress').textContent=
    currentUser?.wallet_address||
    'Wallet address not returned by Pi session';

  const saved=
    localStorage.getItem('amtPetProfileImage');

  if(saved){

    $('avatar').innerHTML=
      '<img class="avatar" src="'+
      esc(saved)+
      '" alt="Profile">';

  }

  loadMyPets();
  renderMarket();
}

/* =========================================================
   PROFILE
   ========================================================= */

function previewProfile(){

  const f=$('profileImage').files[0];

  if(!f)return;

  if(f.size>5*1024*1024){

    toast(
      'Maximum profile image size is 5 MB.'
    );

    $('profileImage').value='';

    return;
  }

  const r=new FileReader();

  r.onload=()=>{

    $('avatar').innerHTML=
      '<img class="avatar" src="'+
      esc(r.result)+
      '" alt="Profile preview">';

    window.__profileData=r.result;
  };

  r.readAsDataURL(f);
}

function saveProfilePicture(){

  if(!window.__profileData){

    toast(
      'Choose a profile picture first.'
    );

    return;
  }

  localStorage.setItem(
    'amtPetProfileImage',
    window.__profileData
  );

  toast(
    'Profile picture saved on this device.'
  );

}

/* =========================================================
   PET CATALOG
   ========================================================= */

async function load(){

  try{

    const r=await fetch(
      API+'/api/pets',
      {
        cache:'no-store'
      }
    );

    if(!r.ok){
      throw Error('HTTP '+r.status);
    }

    const d=await r.json();

    pets=d.pets||[];

    $('count').textContent=pets.length;

    renderMarket();

  }catch(e){

    console.error(
      'Pet catalog:',
      e
    );

    $('grid').innerHTML=
      '<div class="msg">'+
      '❌ Cannot load pet catalog. Check the Render service.'+
      '</div>';

  }
}

function getPetPiPrice(p){

  /*
   * AMT Pet Marketplace Testnet price is 10 Pi.
   *
   * Backend Render configuration:
   * PET_PI_PRICE = 10
   *
   * We intentionally DO NOT use 100 as fallback.
   */
  const value=
    Number(
      p?.pi_price||
      p?.price_pi||
      PET_PI_PRICE
    );

  if(!Number.isFinite(value)||value<=0){
    return PET_PI_PRICE;
  }

  return value;
}

function renderMarket(){

  const s=
    ($('q')?.value||'')
    .toLowerCase()
    .trim();

  const e=
    $('el')?.value||
    'All Elements';

  const z=
    $('sort')?.value||
    'name';

  let a=pets.filter(p=>
    (
      !s||
      String(p.name)
        .toLowerCase()
        .includes(s)||
      String(p.pet_code)
        .toLowerCase()
        .includes(s)
    )&&
    (
      e==='All Elements'||
      p.element===e
    )
  );

  a.sort((x,y)=>
    z==='name'
      ?String(x.name)
        .localeCompare(String(y.name))
      :Number(y['base_'+z]||0)-
       Number(x['base_'+z]||0)
  );

  $('grid').innerHTML=
    a.length

    ?

    a.map(p=>{

      const price=getPetPiPrice(p);

      return `
        <article class="petCard">

          <span class="petBadge">
            ${esc(p.element)} • ${esc(p.rarity)}
          </span>

          <img
            class="petPic"
            src="${img(p.image)}"
            alt="${esc(p.name)}"
            loading="lazy"
          >

          <div class="petBody">

            <div class="petName">
              ${esc(p.name)}
            </div>

            <div class="meta">
              <span>${esc(p.pet_code)}</span>
              <span>Lv.1</span>
            </div>

            <div class="stats">

              <span class="stat">
                ❤️ ${p.base_hp}
              </span>

              <span class="stat">
                ⚔️ ${p.base_atk}
              </span>

              <span class="stat">
                🛡️ ${p.base_def}
              </span>

            </div>

            <div class="price">
              🟣 Price: ${price} Pi Testnet
            </div>

            <button
              class="action"
              onclick='openPet(${JSON.stringify(p)})'
            >
              VIEW PET
            </button>

            <button
              class="action gold"
              style="margin-top:8px"
              onclick='quickBuyPet(${JSON.stringify(p)})'
            >
              🛒 BUY WITH PI
            </button>

          </div>

        </article>
      `;

    }).join('')

    :

    '<div class="msg">No pets found.</div>';
}

/* =========================================================
   PET MODAL
   ========================================================= */

function quickBuyPet(p){

  selectedPet=p;

  buyPetPrepared();
}

function openPet(p){

  selectedPet=p;

  $('modalName').textContent=p.name;

  $('modalImg').src=img(p.image);

  $('modalDetails').innerHTML=`

    <div class="stats">

      <span class="stat">
        🌍 ${esc(p.element)}
      </span>

      <span class="stat">
        ⭐ ${esc(p.rarity)}
      </span>

      <span class="stat">
        ❤️ HP ${p.base_hp}
      </span>

      <span class="stat">
        ⚔️ ATK ${p.base_atk}
      </span>

      <span class="stat">
        🛡️ DEF ${p.base_def}
      </span>

    </div>

    <div class="muted">
      ${esc(p.pet_code)} • Level 1 • XP 0
    </div>

    <hr
      style="
        border:0;
        border-top:1px solid #1c3b52;
        margin:12px 0
      "
    >

    <div class="row">

      <span class="muted">
        Evolution
      </span>

      <b>
        Common → Uncommon → Rare → Epic → Legend → Mythic
      </b>

    </div>

    <div
      class="price"
      style="font-size:14px;margin-top:12px"
    >
      🟣 ${getPetPiPrice(p)} Pi Testnet
    </div>

  `;

  $('modal').classList.add('show');
}

function closeModal(){

  $('modal').classList.remove('show');
}

/* =========================================================
   BUY PET
   ========================================================= */

async function buyPetPrepared(){

  if(!selectedPet){

    toast(
      'Select a pet first.'
    );

    return;
  }

  if(!currentUser){

    toast(
      'Login with Pi first.'
    );

    return;
  }

  if(!window.Pi){

    toast(
      'Open AMT Pet Marketplace in Pi Browser.'
    );

    return;
  }

  if(!currentUser.accessToken){

    toast(
      'Please log in with Pi again.'
    );

    return;
  }

  /*
   * Prevent duplicate createPayment calls.
   */
  if(paymentInProgress){

    toast(
      'A Pi payment is already processing. Please wait.'
    );

    return;
  }

  /*
   * Before creating another payment, check whether
   * the previous authentication found an incomplete payment.
   */
  if(window.__incompletePiPayment){

    toast(
      'A previous Pi payment is pending. Recovering it first...'
    );

    await recoverIncompletePayment(
      window.__incompletePiPayment
    );

    return;
  }

  const amount=getPetPiPrice(selectedPet);

  /*
   * Safety check:
   * AMT Pet Marketplace currently uses 10 Pi Testnet.
   */
  if(amount!==PET_PI_PRICE){

    console.warn(
      'Pet price mismatch. Using configured Testnet price:',
      PET_PI_PRICE
    );
  }

  const finalAmount=PET_PI_PRICE;

  const petCode=selectedPet.pet_code;

  const petName=selectedPet.name;

  const memo=
    'AMT Pet Marketplace - '+
    petCode;

  const metadata={
    type:'pet_purchase',
    pet_code:petCode,
    pet_name:petName
  };

  /*
   * Save the pet code locally so that if Pi reports
   * an incomplete payment, we can recover it.
   */
  localStorage.setItem(
    'amtPetPendingPetCode',
    petCode
  );

  paymentInProgress=true;

  try{

    toast(
      'Opening Pi payment for '+finalAmount+' Pi...'
    );

    await new Promise((resolve,reject)=>{

      let settled=false;

      const fail=e=>{

        if(settled)return;

        settled=true;

        reject(
          e instanceof Error
            ?e
            :Error(
              String(
                e||
                'Pi payment failed.'
              )
            )
        );
      };

      const done=v=>{

        if(settled)return;

        settled=true;

        resolve(v);
      };

      Pi.createPayment(

        {
          amount:finalAmount,
          currency:'Pi',
          memo:memo,
          metadata:metadata
        },

        {

          /* =================================================
             SERVER APPROVAL
             ================================================= */

          onReadyForServerApproval:async paymentId=>{

            try{

              console.log(
                'Pi payment ready for approval:',
                paymentId
              );

              localStorage.setItem(
                'amtPetPendingPaymentId',
                String(paymentId)
              );

              const prep=
                await fetch(
                  API+'/api/payments/pi/prepare',
                  {
                    method:'POST',

                    headers:{
                      'Content-Type':
                        'application/json',

                      'Authorization':
                        'Bearer '+
                        currentUser.accessToken
                    },

                    body:JSON.stringify({

                      payment_id:
                        paymentId,

                      pet_code:
                        petCode

                    })
                  }
                );

              const prepData=
                await prep
                  .json()
                  .catch(()=>({}));

              console.log(
                'Pi payment prepared:',
                prepData
              );

              if(!prep.ok){

                throw Error(
                  prepData.error||
                  prepData.message||
                  'Payment preparation failed.'
                );

              }

              const approval=
                await fetch(
                  API+'/api/payments/pi/approve',
                  {
                    method:'POST',

                    headers:{
                      'Content-Type':
                        'application/json',

                      'Authorization':
                        'Bearer '+
                        currentUser.accessToken
                    },

                    body:JSON.stringify({

                      payment_id:
                        paymentId,

                      pet_code:
                        petCode

                    })
                  }
                );

              const approvalData=
                await approval
                  .json()
                  .catch(()=>({}));

              console.log(
                'Pi payment approved:',
                approvalData
              );

              if(!approval.ok){

                throw Error(
                  approvalData.error||
                  approvalData.message||
                  'Server approval failed.'
                );

              }

            }catch(e){

              console.error(
                'Pi approval:',
                e
              );

              fail(e);
            }
          },

          /* =================================================
             SERVER COMPLETION
             ================================================= */

          onReadyForServerCompletion:
            async(paymentId,txid)=>{

              try{

                console.log(
                  'Pi payment ready for completion:',
                  {
                    paymentId,
                    txid
                  }
                );

                localStorage.setItem(
                  'amtPetPendingPaymentId',
                  String(paymentId)
                );

                const body={
                  payment_id:
                    paymentId,

                  pet_code:
                    petCode
                };

                /*
                 * IMPORTANT:
                 * Pi supplies transaction ID here.
                 * Send it directly to Render backend.
                 */
                if(txid){

                  body.txid=txid;

                }

                const complete=
                  await fetch(
                    API+'/api/payments/pi/complete',
                    {
                      method:'POST',

                      headers:{
                        'Content-Type':
                          'application/json',

                        'Authorization':
                          'Bearer '+
                          currentUser.accessToken
                      },

                      body:
                        JSON.stringify(body)
                    }
                  );

                const completeData=
                  await complete
                    .json()
                    .catch(()=>({}));

                console.log(
                  'Pi payment completed:',
                  completeData
                );

                if(!complete.ok){

                  throw Error(
                    completeData.error||
                    completeData.message||
                    'Payment completion failed.'
                  );

                }

                /*
                 * Payment completed successfully.
                 */
                localStorage.removeItem(
                  'amtPetPendingPaymentId'
                );

                localStorage.removeItem(
                  'amtPetPendingPetCode'
                );

                window.__incompletePiPayment=null;

                done(completeData);

              }catch(e){

                console.error(
                  'Pi completion:',
                  e
                );

                fail(e);
              }
            },

          /* =================================================
             CANCEL
             ================================================= */

          onCancel:()=>{

            localStorage.removeItem(
              'amtPetPendingPaymentId'
            );

            localStorage.removeItem(
              'amtPetPendingPetCode'
            );

            fail(
              Error(
                'Payment cancelled.'
              )
            );
          },

          /* =================================================
             ERROR
             ================================================= */

          onError:error=>{

            console.error(
              'Pi payment error:',
              error
            );

            fail(
              Error(
                error?.message||
                'Pi payment failed.'
              )
            );
          }

        }
      );

    });

    closeModal();

    toast(
      petName+
      ' purchased successfully with Pi Testnet.'
    );

    await loadMyPets();

  }catch(e){

    console.error(
      'BUY PET:',
      e
    );

    toast(
      e?.message||
      'Pi payment was not completed.'
    );

  }finally{

    paymentInProgress=false;
  }
}

/* =========================================================
   MY PETS
   ========================================================= */

async function loadMyPets(){

  $('myPets').innerHTML=
    '<div class="msg">Loading your pets...</div>';

  try{

    const uid=
      currentUser?.uid||
      localStorage.getItem('amtPetPiUid');

    if(!uid){

      renderMyPets([]);

      return;
    }

    /*
     * IMPORTANT:
     * Backend route is:
     *
     * /api/my-pets/:pi_uid
     *
     * NOT:
     *
     * /api/my-pets?pi_uid=
     */
    const r=
      await fetch(
        API+
        '/api/my-pets/'+
        encodeURIComponent(uid),
        {
          cache:'no-store'
        }
      );

    if(!r.ok){

      throw Error(
        'HTTP '+r.status
      );

    }

    const d=
      await r.json();

    const list=
      d.pets||
      d.ownedPets||
      [];

    renderMyPets(list);

  }catch(e){

    console.error(
      'My Pets:',
      e
    );

    renderMyPets([]);
  }
}

function renderMyPets(list){

  $('ownedCount').textContent=
    list.length;

  if(!list.length){

    $('myPets').innerHTML=
      '<div class="msg">'+
      '🐾 No owned pets yet.<br>'+
      'Buy a pet from the Marketplace to start your collection.'+
      '</div>';

    return;
  }

  $('myPets').innerHTML=
    list.map(p=>`

      <div class="owned">

        <img
          src="${img(p.image)}"
          alt="${esc(p.name)}"
        >

        <div>

          <b>
            ${esc(p.name)}
          </b>

          <br>

          <span class="muted">
            ${esc(p.element||'—')}
            •
            ${esc(p.rarity||'Common')}
            •
            Lv.${esc(p.level||1)}
          </span>

        </div>

      </div>

    `).join('');
}
